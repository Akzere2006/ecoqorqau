name: Validate web and mobile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackathon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, TypeScript, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify web application
        run: npm run verify

      - name: Audit web dependencies
        run: npm run audit

  mobile:
    name: iOS — TypeScript, Expo Doctor and production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify Expo application
        run: npm run verify

      - name: Audit mobile dependencies
        run: npm run audit

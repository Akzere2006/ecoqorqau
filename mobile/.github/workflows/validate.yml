name: Validate Expo MVP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, Expo Doctor and iOS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check Expo package compatibility
        run: npm run expo:check

      - name: Run Expo Doctor
        run: npm run doctor

      - name: Build production iOS bundle
        run: npm run export:ios
